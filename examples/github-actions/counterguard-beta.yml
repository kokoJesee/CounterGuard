{
  "name": "CounterGuard Beta Docker acceptance",
  "on": {"workflow_dispatch": {"inputs": {"scenario": {
    "type": "choice", "default": "fixed",
    "options": ["fixed", "shadow-regression", "active-regression", "unknown"],
    "description": "Tool-owned demo only; Active regression deliberately fails"
  }}}},
  "permissions": {"contents": "read"},
  "jobs": {"verify": {
    "runs-on": "ubuntu-24.04", "timeout-minutes": 25,
    "env": {
      "CG_TOOL_SHA": "fcbf6a832d1784597924de2d3897f5433d88e39c",
      "CG_WHEEL_SHA256": "dd9f1fc9fdebc8ab2a005917521d37685a42924ee2efb806d775be524e678784",
      "CG_REQUIREMENTS_SHA256": "1817b7e698c0fdcac5734ad14701fe6c278234a570e65e38e63e3ce97c903042",
      "CG_ARCHIVE_SHA256": "c405aecaa89e465d8b41a50999f4bdbfaada16723eccb007cf7f51a8fd1cd970",
      "CG_RELEASE_URL": "https://github.com/kokoJesee/CounterGuard/releases/download/v0.5.0",
      "CG_SCENARIO": "${{ inputs.scenario }}"
    },
    "steps": [
      {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262", "with": {
        "repository": "kokoJesee/CounterGuard", "ref": "${{ env.CG_TOOL_SHA }}",
        "fetch-depth": 0, "persist-credentials": false, "path": "tool"
      }},
      {"uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": {"python-version": "3.13"}},
      {"name": "Download and hash-check the reviewed tool and runner", "shell": "bash", "run": "set -euo pipefail\ncd \"$RUNNER_TEMP\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 10485760 -o counterguard-0.5.0-py3-none-any.whl \"$CG_RELEASE_URL/counterguard-0.5.0-py3-none-any.whl\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 1048576 -o requirements.txt \"$CG_RELEASE_URL/counterguard-0.5.0-runner-requirements.txt\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 300 --max-filesize 536870912 -o runner.tar \"$CG_RELEASE_URL/counterguard-runner-root.tar\"\nprintf '%s  %s\\n' \"$CG_WHEEL_SHA256\" counterguard-0.5.0-py3-none-any.whl \"$CG_REQUIREMENTS_SHA256\" requirements.txt \"$CG_ARCHIVE_SHA256\" runner.tar | sha256sum --check -\npython -m pip install --only-binary=:all: --require-hashes -r requirements.txt\npython -m pip install --no-deps ./counterguard-0.5.0-py3-none-any.whl\ndocker load --input runner.tar\ncounterguard runner show root-pytest8 --format text"},
      {"name": "Run Docker-only standalone onboarding and preserve exit policy", "shell": "bash", "run": "python -I tool/scripts/run_standalone_ci_fixture.py --workspace ci-run --scenario \"$CG_SCENARIO\""},
      {"name": "Always publish the allowlisted Step Summary", "if": "${{ always() }}", "shell": "bash", "run": "if [ -f ci-run/public/summary.md ]; then\n  cat ci-run/public/summary.md >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  printf '# CounterGuard\\n\\nSetup or admission failed; verification was not completed.\\n' >> \"$GITHUB_STEP_SUMMARY\"\nfi"},
      {"name": "Upload public projections only", "if": "${{ always() }}", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {
        "name": "counterguard-beta-summary-${{ github.run_id }}-${{ github.run_attempt }}",
        "path": "ci-run/public/summary.json\nci-run/public/summary.md",
        "if-no-files-found": "error", "retention-days": 7, "include-hidden-files": false
      }}
    ]
  }}
}
